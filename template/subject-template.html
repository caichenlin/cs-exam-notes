<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>科目名稱｜資工所考試準備</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="container">
    <header>
      <a class="back-link" href="../index.html">← 回首頁</a>
      <div class="banner">
        <div class="tag-list">
          <span class="tag">【類別】</span>
        </div>
        <h1>科目名稱</h1>
        <!-- 數字須與下方實際內容一致（見 CLAUDE.md 第 6 節） -->
        <p class="banner-summary">【N 個重點・N 題示範題・N 個易錯觀念】</p>
      </div>
    </header>

    <main>
      <!-- 以下四個區塊的名稱、id、順序固定，不可更動（見 CLAUDE.md 第 6 節） -->

      <section id="scope">
        <h2>考試範圍</h2>
        <ul>
          <li>待補</li>
        </ul>
      </section>

      <section id="key-points">
        <h2>重點整理</h2>
        <h3>重點名稱（待補）</h3>
        <p>待補：用白話文說明。</p>
        <!-- 必要時附短程式碼：
        <pre><code>程式碼</code></pre>
        -->
      </section>

      <section id="past-questions">
        <h2>考古題解析</h2>
        <dl class="question">
          <dt>題型概述</dt>
          <dd>待補</dd>
          <dt>解析</dt>
          <dd>待補</dd>
          <dt>出處</dt>
          <dd>待補（學校＋年度；自編題請寫「自編示範題」）</dd>
        </dl>
      </section>

      <section id="common-mistakes">
        <h2>易錯題</h2>
        <ul>
          <li><strong>錯誤觀念：</strong>待補<br><strong>正確說法：</strong>待補</li>
        </ul>
      </section>
    </main>

    <footer class="site-footer">
      <p>最後更新：YYYY-MM-DD</p>
    </footer>
  </div>
</body>
</html>
